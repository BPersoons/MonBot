      - generic [ref=e49]:
        - generic [ref=e50]:
          - heading "Ontdek de Kernselectie" [level=1] [ref=e51]
          - paragraph [ref=e52]: Met de vernieuwde Kernselectie krijg je toegang tot een breed scala aan beursgenoteerde producten tegen lage kosten. Hiermee beleg je in nog meer ETF's ETC's en ETN's voor slechts €1 per transactie op Tradegate. En geniet je van nog meer keuze tegen dezelfde ongekend lage kosten en zonder de beperkingen van een Fair Use Policy.
          - generic [ref=e53]:
            - button "Start met beleggen" [ref=e56] [cursor=pointer]
            - link "Inloggen" [ref=e58] [cursor=pointer]:
              - /url: https://trader.degiro.nl/login/nl
        - img "Smartphone met DEGIRO app. Aandelengrafiek en mand met diverse producten die diversificatie van een portefeuille illustreren" [ref=e60]
      - generic [ref=e63]:
        - img "diversification" [ref=e66]
        - generic [ref=e67]:
          - heading "Kies uit een breed productaanbod voor € 1" [level=2] [ref=e68]
          - paragraph [ref=e69]: Met de vernieuwde Kernselectie krijg je toegang tot het volledige aanbod van ETF's, ETC's en ETN's dat beschikbaar is op Tradegate. Dat betekent dat je meer dan 1000 producten kunt verhandelen tegen slechts €1 handelingskosten. Valuta-, externe product- en spreadkosten kunnen van toepassing zijn.
      - generic [ref=e72]:
        - generic [ref=e74]:
          - heading "Diversificatie van je portefeuille" [level=2] [ref=e75]
          - paragraph [ref=e76]: Eén van de belangrijkste aspecten van beleggen is diversificatie. ETF's kunnen je daarbij helpen. Omdat elke ETF meestal een mandje met effecten bevat, beleg je met één transactie in tientallen, honderden of zelfs duizenden beursgenoteerde bedrijven of onderliggende waarden. Hierdoor spreid je het risico over verschillende sectoren, regio’s en producten waardoor je minder afhankelijk bent de prestaties van één bedrijf of markt. De Kernselectie is ontworpen om je te helpen bij het diversifiëren van je beleggingen, zonder een aanslag op je portemonnee te zijn.
        - img "Phone product list" [ref=e79]
