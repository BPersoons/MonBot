            - paragraph [ref=e345]: "We willen mensen helpen om de beste beleggers te worden die ze kunnen zijn. Op ons gebruiksvriendelijke platform vind je een universum aan mogelijkheden en keuzes. Dit neemt drempels weg zodat beleggen iets voor iedereen wordt: beginners of experts. Je krijgt toegang tot een breed scala aan producten op meer dan 45 wereldwijde beurzen, zodat je de vrijheid hebt om te beleggen zoals jij wil. In onze wereld krijg je ook waar voor je geld. Dus, zonder ook maar iets te veranderen aan de hoge kwaliteit, veiligheid en het aanbod van onze diensten, bieden we ongelooflijk lage tarieven. Door jouw beleggingsbehoeftes voorop te stellen, zijn we uitgegroeid tot één van de meest toonaangevende online brokers van Europa. Meer dan 3 miljoen klanten en meer dan 100 internationale prijzen zijn een bewijs van dit succes."
