version: '3.8'
services:
  agent-trader:
    image: europe-west1-docker.pkg.dev/gen-lang-client-0441524375/agent-trader/swarm:latest
    container_name: agent_trader_swarm
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - GOOGLE_CLOUD_PROJECT=gen-lang-client-0441524375
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./dashboard.json:/app/dashboard.json
      - ./trade_log.json:/app/trade_log.json
      - ./active_assets.json:/app/active_assets.json
      - ./pnl_snapshots.json:/app/pnl_snapshots.json
      - ./config/auto_params.json:/app/config/auto_params.json
      - ./config/sleeves.json:/app/config/sleeves.json
      # Leer- en positie-state: moet een full redeploy overleven (2026-07-06)
      - ./shadow_book.json:/app/shadow_book.json
      - ./shadow_report.json:/app/shadow_report.json
      - ./shadow_basis_state.json:/app/shadow_basis_state.json
      - ./shadow_basis_log.json:/app/shadow_basis_log.json
      - ./shadow_basis_report.json:/app/shadow_basis_report.json
      - ./shadow_xyz_funding_state.json:/app/shadow_xyz_funding_state.json
      - ./shadow_xyz_funding_log.json:/app/shadow_xyz_funding_log.json
      - ./shadow_xyz_funding_report.json:/app/shadow_xyz_funding_report.json
      - ./shadow_xyz_gap_state.json:/app/shadow_xyz_gap_state.json
      - ./shadow_xyz_gap_log.json:/app/shadow_xyz_gap_log.json
      - ./shadow_xyz_gap_report.json:/app/shadow_xyz_gap_report.json
      - ./shadow_xyz_listings_state.json:/app/shadow_xyz_listings_state.json
      - ./shadow_xyz_listings_log.json:/app/shadow_xyz_listings_log.json
      - ./shadow_xyz_listings_report.json:/app/shadow_xyz_listings_report.json
      - ./ticker_state.json:/app/ticker_state.json
      - ./decision_history.json:/app/decision_history.json
      - ./treasury_harvest.json:/app/treasury_harvest.json
      - ./treasury_proposals.json:/app/treasury_proposals.json
      - ./audited_trades.json:/app/audited_trades.json
      - ./portfolio_peak.json:/app/portfolio_peak.json
      - ./cost_log.json:/app/cost_log.json
      - ./polymarket_shadow_log.json:/app/polymarket_shadow_log.json
      - ./config/treasury_allocation.json:/app/config/treasury_allocation.json
      # Thematic Dip Sleeve (EXP-008, 2026-07-16): echte posities + budget-state — moet een full redeploy overleven
      - ./config/thematic_dip_themes.json:/app/config/thematic_dip_themes.json
      - ./thematic_dip_state.json:/app/thematic_dip_state.json
      - ./thematic_dip_positions.json:/app/thematic_dip_positions.json
      - ./thematic_dip_report.json:/app/thematic_dip_report.json
    networks: [trader_net]

networks:
  trader_net:
    driver: bridge
