version: '3.8'
services:
  agent-trader:
    image: europe-west1-docker.pkg.dev/gen-lang-client-0441524375/agent-trader/swarm:latest
    container_name: agent_trader_swarm
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - GOOGLE_CLOUD_PROJECT=gen-lang-client-0441524375
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./dashboard.json:/app/dashboard.json
      - ./trade_log.json:/app/trade_log.json
      - ./active_assets.json:/app/active_assets.json
      - ./pnl_snapshots.json:/app/pnl_snapshots.json
      - ./config/auto_params.json:/app/config/auto_params.json
      - ./config/sleeves.json:/app/config/sleeves.json
      # Leer- en positie-state: moet een full redeploy overleven (2026-07-06)
      - ./shadow_book.json:/app/shadow_book.json
      - ./shadow_report.json:/app/shadow_report.json
      - ./shadow_basis_state.json:/app/shadow_basis_state.json
      - ./shadow_basis_log.json:/app/shadow_basis_log.json
      - ./shadow_basis_report.json:/app/shadow_basis_report.json
      - ./shadow_xyz_funding_state.json:/app/shadow_xyz_funding_state.json
      - ./shadow_xyz_funding_log.json:/app/shadow_xyz_funding_log.json
      - ./shadow_xyz_funding_report.json:/app/shadow_xyz_funding_report.json
      - ./shadow_xyz_gap_state.json:/app/shadow_xyz_gap_state.json
      - ./shadow_xyz_gap_log.json:/app/shadow_xyz_gap_log.json
      - ./shadow_xyz_gap_report.json:/app/shadow_xyz_gap_report.json
      - ./shadow_xyz_listings_state.json:/app/shadow_xyz_listings_state.json
      - ./shadow_xyz_listings_log.json:/app/shadow_xyz_listings_log.json
      - ./shadow_xyz_listings_report.json:/app/shadow_xyz_listings_report.json
      - ./ticker_state.json:/app/ticker_state.json
      - ./decision_history.json:/app/decision_history.json
      - ./treasury_harvest.json:/app/treasury_harvest.json
      - ./treasury_proposals.json:/app/treasury_proposals.json
      - ./audited_trades.json:/app/audited_trades.json
      - ./portfolio_peak.json:/app/portfolio_peak.json
      - ./cost_log.json:/app/cost_log.json
      - ./polymarket_shadow_log.json:/app/polymarket_shadow_log.json
      - ./config/treasury_allocation.json:/app/config/treasury_allocation.json
      # Thematic Exposure Sleeve (EXP-008, 2026-07-16, hernoemd van thematic_dip 2026-07-17): echte posities + budget-state — moet een full redeploy overleven
      - ./config/thematic_exposure_themes.json:/app/config/thematic_exposure_themes.json
      - ./thematic_exposure_state.json:/app/thematic_exposure_state.json
      - ./thematic_exposure_positions.json:/app/thematic_exposure_positions.json
      - ./thematic_exposure_report.json:/app/thematic_exposure_report.json
      - ./thematic_wallet_peak.json:/app/thematic_wallet_peak.json
      - ./positions_status.json:/app/positions_status.json
      # Conviction Barbell (2026-07-28): groei-been crypto (spot BTC/ETH buy-and-hold).
      # De config draagt target_usd + enabled — die MOETEN een redeploy overleven,
      # anders valt de sleeve terug op enabled=false/target 0 uit de image.
      - ./config/conviction_core.json:/app/config/conviction_core.json
      - ./config/barbell_targets.json:/app/config/barbell_targets.json
      - ./conviction_core_state.json:/app/conviction_core_state.json
      # Drift hersteld 2026-08-11: deze 13 stonden in de schrijflaag van de container
      # en waren noch gemount, noch opgenomen in STATE_FILES van deploy_update.sh —
      # een compose-recreate had ze vernietigd. Gevonden met `docker diff`.
      # Het zwaarste geval is monitor_telegram_offset.json: zonder offset kan de bot
      # oude Telegram-berichten opnieuw verwerken, inclusief /approve-commando's.
      - ./monitor_telegram_offset.json:/app/monitor_telegram_offset.json
      - ./monitor_alert_state.json:/app/monitor_alert_state.json
      - ./monitoring_watchlist.json:/app/monitoring_watchlist.json
      - ./rsi_digest_state.json:/app/rsi_digest_state.json
      - ./llm_usage.json:/app/llm_usage.json
      - ./pipeline_events.json:/app/pipeline_events.json
      - ./treasury_state.json:/app/treasury_state.json
      - ./sleeve_revalidation.json:/app/sleeve_revalidation.json
      - ./directional_revalidation.json:/app/directional_revalidation.json
      - ./learning_report.json:/app/learning_report.json
      - ./market_regime.json:/app/market_regime.json
      - ./equity_regime.json:/app/equity_regime.json
      - ./data_cache.json:/app/data_cache.json
    networks: [trader_net]

networks:
  trader_net:
    driver: bridge
